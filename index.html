<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulário Interativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3d;
      --border-focus: #6c63ff;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --success: #43e97b;
      --error: #ff6584;
      --text: #e8e8f0;
      --text-muted: #6e6e8a;
      --text-label: #a0a0c0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* Background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,101,132,0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    /* Header */
    .header {
      margin-bottom: 2.5rem;
      animation: fadeUp 0.6s ease both;
    }
    .tag {
      display: inline-block;
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(108,99,255,0.4);
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
    }
    h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 0.75rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.6;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.6s ease 0.1s both;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108,99,255,0.6), transparent);
    }

    /* Form groups */
    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-label);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      transition: color 0.2s;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: color 0.2s;
      pointer-events: none;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    input::placeholder { color: var(--text-muted); }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
      background: #16162a;
    }
    input:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--accent);
    }

    /* Valid/Invalid states */
    input.valid {
      border-color: var(--success);
      box-shadow: 0 0 0 3px rgba(67,233,123,0.1);
    }
    input.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(255,101,132,0.12);
      animation: shake 0.4s ease;
    }

    /* Status icon inside input */
    .status-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    input.valid ~ .status-icon { opacity: 1; }
    input.invalid ~ .status-icon { opacity: 1; }

    /* Error message */
    .error-msg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      color: var(--error);
      margin-top: 0.45rem;
      padding-left: 0.25rem;
      min-height: 1.2em;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Submit button */
    .btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8b82ff);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #8b82ff, var(--accent2));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,99,255,0.4); }
    .btn:hover::before { opacity: 1; }
    .btn:active { transform: translateY(0); }
    .btn span { position: relative; z-index: 1; }

    .btn.loading span { opacity: 0; }
    .btn.loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      transform: translate(-50%,-50%);
      animation: spin 0.6s linear infinite;
    }

    /* Success state */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1rem 0;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .success-screen.show { display: flex; }
    .form-fields.hide { display: none; }

    .success-circle {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--success), #00c96f);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.25rem;
      box-shadow: 0 0 40px rgba(67,233,123,0.35);
    }
    .success-circle svg { width: 36px; height: 36px; color: white; }
    .success-screen h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .success-screen p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; }
    .reset-btn {
      margin-top: 1.5rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
      80% { transform: translateX(-3px); }
    }
    @keyframes spin {
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="tag">Atividade Prática 3</div>
      <h1>Entre em <span>contato</span></h1>
      <p class="subtitle">Preencha os campos abaixo. Todos os dados são validados em tempo real.</p>
    </div>

    <div class="card">
      <!-- Form fields -->
      <div class="form-fields" id="formFields">
        <form id="myForm" novalidate>

          <!-- Nome -->
          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <div class="input-wrap">
              <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" autocomplete="name" />
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span class="status-icon" id="nomeIcon"></span>
            </div>
            <div class="error-msg" id="nomeError">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span id="nomeErrorText"></span>
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <input type="email" id="email" name="email" placeholder="Ex: maria@email.com" autocomplete="email" />
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <span class="status-icon" id="emailIcon"></span>
            </div>
            <div class="error-msg" id="emailError">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span id="emailErrorText"></span>
            </div>
          </div>

          <button type="submit" class="btn" id="submitBtn">
            <span>Enviar Formulário →</span>
          </button>
        </form>
      </div>

      <!-- Success screen -->
      <div class="success-screen" id="successScreen">
        <div class="success-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2>Enviado com sucesso!</h2>
        <p>Obrigado, <strong id="successName"></strong>!<br/>Suas informações foram recebidas.</p>
        <button class="reset-btn" id="resetBtn">← Novo envio</button>
      </div>
    </div>
  </div>

  <script>
    // ─── Utilitários ────────────────────────────────────
    function showError(inputEl, iconEl, errorEl, textEl, msg) {
      inputEl.classList.remove('valid');
      inputEl.classList.add('invalid');
      iconEl.textContent = '✕';
      iconEl.style.color = 'var(--error)';
      textEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function showValid(inputEl, iconEl, errorEl) {
      inputEl.classList.remove('invalid');
      inputEl.classList.add('valid');
      iconEl.textContent = '✓';
      iconEl.style.color = 'var(--success)';
      errorEl.classList.remove('visible');
    }

    function clearState(inputEl, iconEl, errorEl) {
      inputEl.classList.remove('valid', 'invalid');
      iconEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    // ─── Referências ─────────────────────────────────────
    const form        = document.getElementById('myForm');
    const nomeInput   = document.getElementById('nome');
    const emailInput  = document.getElementById('email');
    const nomeIcon    = document.getElementById('nomeIcon');
    const emailIcon   = document.getElementById('emailIcon');
    const nomeError   = document.getElementById('nomeError');
    const emailError  = document.getElementById('emailError');
    const nomeText    = document.getElementById('nomeErrorText');
    const emailText   = document.getElementById('emailErrorText');
    const submitBtn   = document.getElementById('submitBtn');
    const formFields  = document.getElementById('formFields');
    const successScreen = document.getElementById('successScreen');
    const successName = document.getElementById('successName');
    const resetBtn    = document.getElementById('resetBtn');

    // ─── Validação: Nome ─────────────────────────────────
    function validateNome(blur = false) {
      const val = nomeInput.value.trim();
      if (!val) {
        if (blur) showError(nomeInput, nomeIcon, nomeError, nomeText, 'O nome é obrigatório.');
        else clearState(nomeInput, nomeIcon, nomeError);
        return false;
      }
      if (val.length < 3) {
        showError(nomeInput, nomeIcon, nomeError, nomeText, 'O nome deve ter pelo menos 3 caracteres.');
        return false;
      }
      if (!/^[a-zA-ZÀ-ÿ\s'-]+$/.test(val)) {
        showError(nomeInput, nomeIcon, nomeError, nomeText, 'Use apenas letras e espaços.');
        return false;
      }
      if (!val.includes(' ')) {
        showError(nomeInput, nomeIcon, nomeError, nomeText, 'Informe o nome completo (nome e sobrenome).');
        return false;
      }
      showValid(nomeInput, nomeIcon, nomeError);
      return true;
    }

    // ─── Validação: E-mail ────────────────────────────────
    function validateEmail(blur = false) {
      const val = emailInput.value.trim();
      if (!val) {
        if (blur) showError(emailInput, emailIcon, emailError, emailText, 'O e-mail é obrigatório.');
        else clearState(emailInput, emailIcon, emailError);
        return false;
      }
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
      if (!re.test(val)) {
        showError(emailInput, emailIcon, emailError, emailText, 'Insira um e-mail válido. Ex: nome@email.com');
        return false;
      }
      showValid(emailInput, emailIcon, emailError);
      return true;
    }

    // ─── Eventos de tempo real ───────────────────────────
    nomeInput.addEventListener('input', () => validateNome());
    nomeInput.addEventListener('blur',  () => validateNome(true));

    emailInput.addEventListener('input', () => validateEmail());
    emailInput.addEventListener('blur',  () => validateEmail(true));

    // ─── Submit ──────────────────────────────────────────
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const nomeOk  = validateNome(true);
      const emailOk = validateEmail(true);

      if (!nomeOk || !emailOk) return;

      // Simula loading
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      setTimeout(() => {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;

        // Mostra tela de sucesso
        successName.textContent = nomeInput.value.trim().split(' ')[0];
        formFields.classList.add('hide');
        successScreen.classList.add('show');
      }, 1500);
    });

    // ─── Reset ───────────────────────────────────────────
    resetBtn.addEventListener('click', function() {
      form.reset();
      [nomeInput, emailInput].forEach(el => el.classList.remove('valid','invalid'));
      [nomeIcon, emailIcon].forEach(el => el.textContent = '');
      [nomeError, emailError].forEach(el => el.classList.remove('visible'));
      successScreen.classList.remove('show');
      formFields.classList.remove('hide');
    });
  </script>
</body>
</html>
